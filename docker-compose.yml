# Docker Compose for Telegram Bot
services:
  telegram-bot:
    build: .
    container_name: telegrambot
    env_file:
      - .env
    environment:
      - DATABASE_PATH=/app/data/tournaments.db
    ports:
      - "${WEBHOOK_BIND_ADDRESS:-0.0.0.0}:${WEBHOOK_PORT:-8080}:${WEBHOOK_PORT:-8080}"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
